# FluxCache Docker Compose — S3 (MinIO) integration test environment
#
# Usage:
#   docker compose up --build          # Build and start all services
#   docker compose up                   # Start (if already built)
#   docker compose run test-runner      # Run S3 e2e tests
#   docker compose down -v              # Stop and clean up volumes
#
# Services:
#   minio              — S3-compatible object storage
#   minio-init         — One-shot: create bucket + upload test files
#   fluxcache-master   — FluxCache Master
#   fluxcache-worker   — FluxCache Worker
#   test-runner        — S3 e2e test suite

services:
  # ---- MinIO (S3 backend) ----
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: fluxcache
      MINIO_ROOT_PASSWORD: fluxcache123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - minio_data:/data

  # ---- Initialize MinIO: create bucket + test data ----
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set fluxlocal http://minio:9000 fluxcache fluxcache123 &&
      mc mb fluxlocal/fluxcache-test --ignore-existing &&
      echo 'Hello from S3 e2e test!' | mc pipe fluxlocal/fluxcache-test/hello.txt &&
      echo 'FluxCache integration test file' | mc pipe fluxlocal/fluxcache-test/data/test.txt &&
      echo 'MinIO bucket initialized successfully'
      "

  # ---- FluxCache Master ----
  fluxcache-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      fluxcache-master --config /etc/fluxcache/config.yaml
    ports:
      - "9090:9090"
      - "9092:9092"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=fluxcache
      - AWS_SECRET_ACCESS_KEY=fluxcache123
    healthcheck:
      test: ["CMD", "fluxcache-cli", "--master", "127.0.0.1", "--port", "9090", "ls-mounts"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - master_data:/var/lib/fluxcache/master

  # ---- FluxCache Worker ----
  fluxcache-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      fluxcache-worker --config /etc/fluxcache/config.yaml
    ports:
      - "9091:9091"
      - "9093:9093"
    depends_on:
      fluxcache-master:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=fluxcache
      - AWS_SECRET_ACCESS_KEY=fluxcache123
    volumes:
      - worker_data:/var/lib/fluxcache/worker

  # ---- S3 e2e test runner ----
  test-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: /usr/local/bin/run_e2e_test.sh
    depends_on:
      fluxcache-master:
        condition: service_healthy
      fluxcache-worker:
        condition: service_started
    environment:
      - MASTER_HOST=fluxcache-master
      - MASTER_PORT=9090
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=fluxcache-test
      - AWS_ACCESS_KEY_ID=fluxcache
      - AWS_SECRET_ACCESS_KEY=fluxcache123

volumes:
  minio_data:
  master_data:
  worker_data:
