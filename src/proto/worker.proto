syntax = "proto3";

package fluxcache.proto;

import "common.proto";

// WorkerService provides block-level read/write and heartbeat to clients.
service WorkerService {
  rpc ReadPages(ReadPagesRequest) returns (ReadPagesResponse);
  rpc BatchReadPages(BatchReadPagesRequest) returns (BatchReadPagesResponse);
  rpc WritePages(WritePagesRequest) returns (WritePagesResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message ReadPagesRequest {
  uint64 block_id = 1;
  repeated uint32 page_indices = 2;
  int64 expected_mtime_ms = 3;
  string ufs_uri = 4;
  string ufs_path = 5;
}

message ReadPagesResponse {
  bytes data = 1;
}

message BatchReadPagesRequest {
  repeated ReadPagesRequest requests = 1;
}

message BatchReadPagesResponse {
  repeated bytes block_data = 1;
}

message WritePagesRequest {
  uint64 block_id = 1;
  repeated uint32 page_indices = 2;
  bytes data = 3;
  string ufs_uri = 4;
  string ufs_path = 5;
}

message WritePagesResponse {
  optional int64 ufs_mtime_ms = 1;  // mtime from UFS after write, for Client CompleteFile
}

// HeartbeatRequest: Master sends to Worker. Tells Worker what to clean.
message HeartbeatRequest {
  uint64 worker_id = 1;
  // Orphan inodes (deleted files): Worker should DeleteBlockPages for these.
  repeated uint64 orphan_inode_ids = 2;
  // Misplaced blocks (no longer owned by this Worker): Worker should DeleteBlockPages.
  repeated uint64 misplaced_block_ids = 3;
  // Ring snapshot for Worker to compute misplaced locally (workers in ring order).
  repeated WorkerEndpoint ring_workers = 4;
}

// HeartbeatResponse: Worker sends to Master. Reports what was cleaned.
message HeartbeatResponse {
  // Inodes for which Worker cleaned blocks (audit confirmation).
  repeated uint64 audit_inode_ids = 1;
  // Blocks that Worker cleaned (audit confirmation).
  repeated uint64 audit_block_ids = 2;
}
