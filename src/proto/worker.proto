syntax = "proto3";

package fluxcache.proto;

// WorkerService provides block-level read/write and heartbeat to clients.
service WorkerService {
  rpc ReadPages(ReadPagesRequest) returns (ReadPagesResponse);
  rpc WritePages(WritePagesRequest) returns (WritePagesResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message ReadPagesRequest {
  uint64 block_id = 1;
  repeated uint32 page_indices = 2;
  int64 expected_mtime_ms = 3;
  string ufs_uri = 4;
  string ufs_path = 5;
}

message ReadPagesResponse {
  bytes data = 1;
}

message WritePagesRequest {
  uint64 block_id = 1;
  repeated uint32 page_indices = 2;
  bytes data = 3;
  string ufs_uri = 4;
  string ufs_path = 5;
}

message WritePagesResponse {}

// HeartbeatRequest: Phase 1 reserves GC fields; full GC logic not implemented.
message HeartbeatRequest {
  uint64 worker_id = 1;
  // reserved for GC: audit_inode_ids, audit_block_ids
  repeated uint64 audit_inode_ids = 2;
  repeated uint64 audit_block_ids = 3;
}

// HeartbeatResponse: Phase 1 reserves GC fields; full GC logic not implemented.
message HeartbeatResponse {
  // reserved for GC: orphan_inode_ids, misplaced_block_ids
  repeated uint64 orphan_inode_ids = 1;
  repeated uint64 misplaced_block_ids = 2;
}
