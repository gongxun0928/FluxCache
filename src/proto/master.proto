syntax = "proto3";

package fluxcache.proto;

import "common.proto";

// MasterService provides file metadata and cluster topology to clients.
service MasterService {
  rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc CompleteFile(CompleteFileRequest) returns (CompleteFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc Mount(MountRequest) returns (MountResponse);
  rpc Unmount(UnmountRequest) returns (UnmountResponse);
  rpc ListMounts(ListMountsRequest) returns (ListMountsResponse);
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc GetHashRing(GetHashRingRequest) returns (GetHashRingResponse);
  rpc SubmitPrewarm(SubmitPrewarmRequest) returns (SubmitPrewarmResponse);
}

message GetFileInfoRequest {
  string path = 1;
}

message GetFileInfoResponse {
  FileInfo file_info = 1;
  uint64 ring_version = 2;
  repeated WorkerEndpoint workers = 3;
  string ufs_uri = 4;
  string ufs_path = 5;
}

message CreateFileRequest {
  string path = 1;
}

message CreateFileResponse {
  FileInfo file_info = 1;
  string ufs_uri = 2;
  string ufs_path = 3;
}

message CompleteFileRequest {
  uint64 inode_id = 1;
  uint64 size = 2;
}

message CompleteFileResponse {}

message DeleteFileRequest {
  string path = 1;
}

message DeleteFileResponse {}

message MountRequest {
  string path = 1;
  string ufs_uri = 2;
}

message MountResponse {}

message UnmountRequest {
  string path = 1;
}

message UnmountResponse {}

message ListMountsRequest {}

message ListMountsResponse {
  repeated string paths = 1;
}

message RegisterWorkerRequest {
  WorkerEndpoint endpoint = 1;
}

message RegisterWorkerResponse {
  uint64 worker_id = 1;
}

message GetHashRingRequest {}

message SubmitPrewarmRequest {
  string path = 1;  // Logical path, e.g. /mnt/bucket1/dir1/
}

message SubmitPrewarmResponse {}

message GetHashRingResponse {
  uint64 ring_version = 1;
  repeated WorkerEndpoint workers = 2;
}

// --- Raft Journal Entries (P4-02 Master HA) ---

message JournalEntry {
  oneof op {
    CreateFileOp create_file = 1;
    CompleteFileOp complete_file = 2;
    DeleteFileOp delete_file = 3;
    MountOp mount_op = 4;
    UnmountOp unmount_op = 5;
    CreateDirectoryOp create_directory = 6;
    UpsertWorkerOp upsert_worker = 7;
    UpdateWorkerStateOp update_worker_state = 8;
  }
}

message CreateFileOp {
  string path = 1;
  uint64 inode_id = 2;
  uint64 parent_id = 3;
  uint64 size = 4;
  uint64 block_size = 5;
  int64 mtime_ms = 6;
  uint64 next_id = 7;
  int64 creation_time_ms = 8;
}

message CompleteFileOp {
  uint64 inode_id = 1;
  uint64 size = 2;
  uint64 file_version = 3;
}

message DeleteFileOp {
  uint64 inode_id = 1;
  string path = 2;
}

message MountOp {
  string path = 1;
  string ufs_uri = 2;
}

message UnmountOp {
  string path = 1;
}

message CreateDirectoryOp {
  string path = 1;
  uint64 inode_id = 2;
  uint64 parent_id = 3;
  uint64 next_id = 4;
  int64 creation_time_ms = 5;
  int64 modification_time_ms = 6;
}

message UpsertWorkerOp {
  uint64 worker_id = 1;
  string host = 2;
  uint32 port = 3;
  int64 last_heartbeat_ms = 4;
  uint64 next_worker_id = 5;
}

message UpdateWorkerStateOp {
  uint64 worker_id = 1;
  uint32 state = 2;
  int64 last_heartbeat_ms = 3;
  int64 suspect_since_ms = 4;
}

message WorkerTopologySnapshot {
  uint64 next_worker_id = 1;
  uint64 ring_version = 2;
  repeated WorkerTopologyEntry workers = 3;
}

message WorkerTopologyEntry {
  uint64 worker_id = 1;
  string host = 2;
  uint32 port = 3;
  uint32 state = 4;
  int64 last_heartbeat_ms = 5;
  int64 suspect_since_ms = 6;
}
